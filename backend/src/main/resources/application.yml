server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: maansarovar-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/maansarovar_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  upload:
    dir: ${UPLOAD_DIR:/app/uploads}
  admin:
    initial-username: ${ADMIN_USERNAME:admin}
    initial-password: ${ADMIN_PASSWORD:Admin@Maansarovar2026}
    initial-email: ${ADMIN_EMAIL:admin@maansarovar.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

